<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — ASD Parent Health Guide</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4a6fa5; --primary-dark: #3a5a8a;
      --accent: #6bb3a8; --bg: #f5f7fa; --surface: #fff;
      --text: #2d3748; --text-muted: #718096; --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--surface); border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 36px; width: 100%; max-width: 400px;
    }
    .logo {
      width: 60px; height: 60px; border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 20px;
    }
    h1 { text-align: center; font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 28px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 10px 14px; font-size: 0.95rem; color: var(--text);
      transition: border-color 0.15s; margin-bottom: 18px;
    }
    input:focus { outline: none; border-color: var(--primary); }
    .btn {
      width: 100%; background: var(--primary); color: #fff; border: none;
      border-radius: 10px; padding: 12px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: var(--primary-dark); }
    .error {
      background: #fff5f5; border: 1px solid #fc8181; color: #c53030;
      border-radius: 8px; padding: 10px 14px; font-size: 0.85rem;
      margin-bottom: 18px;
    }
    .footer-note {
      text-align: center; font-size: 0.75rem;
      color: var(--text-muted); margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🧩</div>
    <h1>ASD Parent Health Guide</h1>
    <p class="subtitle">Sexual &amp; Reproductive Health Support</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username"
             placeholder="Enter your username" required/>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
             placeholder="Enter your password" required/>

      <button type="submit" class="btn">Sign In</button>
    </form>

    <p class="footer-note">
      This service is for authorised users only.<br/>
      Contact your administrator if you need access.
    </p>
  </div>
</body>
</html>
